services:
  - type: web
    name: agentpay-guard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./agentpay.db
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
